name: Autonomy acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: autonomy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: autonomy-rust-1.95.0-${{ hashFiles('Cargo.lock') }}
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --locked
